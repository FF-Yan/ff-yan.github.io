# Builds the site from build/data/*.js and deploys it to GitHub Pages on every
# push to main, so the live site never depends on remembering `npm run build`.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The custom domain (binxuanyan.dev) stays set on that page.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build pages
        run: node build/build.js

      - name: Collect publishable files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'build' \
            --exclude 'content' \
            --exclude 'node_modules' \
            --exclude 'package.json' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.DS_Store'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
