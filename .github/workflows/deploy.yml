# Builds the site into _site/ and deploys it to GitHub Pages on every push to
# main, so the live site never depends on remembering `npm run build`.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The custom domain (binxuanyan.dev) stays set on that page.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      # Writes the complete site into _site/: the pages plus the files listed
      # in STATIC in build/build.js. Nothing else in the repo is published.
      - name: Build site
        run: node build/build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
